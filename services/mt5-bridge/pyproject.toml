[project]
name = "mt5-bridge"
version = "0.1.0"
description = "MT5 sidecar bridge — narrow internal RPC for MetaTrader 5 terminal"
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[tool.uv.sources]
atlas-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mt5_bridge"]
