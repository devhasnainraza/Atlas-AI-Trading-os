[project]
name = "atlas-scheduler"
version = "0.1.0"
description = "Atlas scheduler — cron-style job execution with missed-run policies"
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
]

[tool.uv.sources]
atlas-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_scheduler"]
