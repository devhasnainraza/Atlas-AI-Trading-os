[project]
name = "atlas-worker"
version = "0.1.0"
description = "Atlas worker — outbox relay, event consumers, background jobs"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0",
    "atlas-shared",
    "geoip2>=4.8",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0.36",
]

[tool.uv.sources]
atlas-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_worker"]
