name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-python:
    name: Python lint (ruff + import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.6.3" }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports

  typecheck-python:
    name: Python typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.6.3" }
      - run: uv sync --frozen
      # mypy --strict on shared packages (platform-wide contracts)
      - run: uv run mypy shared/atlas_core shared/atlas_events shared/atlas_observability shared/atlas_ai --strict --ignore-missing-imports

  lint-typescript:
    name: TypeScript lint + typecheck (turbo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "10" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Unit + integration + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.6.3" }
      - run: uv sync --frozen
      - run: uv run pytest --tb=short

  security-static:
    name: Security static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.6.3" }
      - run: uv sync --frozen
      - name: gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: bandit (Python AST security)
        run: uv run bandit -r shared/ apps/ services/ -c .bandit.yml -q
      - name: pip-audit
        run: uv run pip-audit --fix --dry-run

  docker-build:
    name: Docker image build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --target prod -f infra/docker/Dockerfile.api . --load
      - run: docker buildx build -f infra/docker/Dockerfile.worker . --load
      - run: docker buildx build -f infra/docker/Dockerfile.scheduler . --load
