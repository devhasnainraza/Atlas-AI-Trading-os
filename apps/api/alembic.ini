# Alembic configuration for the Atlas API.
#
# Run from apps/api:  uv run alembic upgrade heads
#
# Note "heads" plural. Each module owns a migration branch (auth, credentials, ...) so two
# teams can add a table in the same week without both editing the same linear chain and
# resolving a down_revision conflict in review. The cost is that every command that would
# say "head" says "heads", and `alembic revision` needs --head=<branch>@head.
#
# The database URL is NOT written here. It comes from ATLAS_DATABASE_URL via env.py — a URL
# in a checked-in ini file is a credential in git history.

[alembic]
script_location = alembic

# One entry per module branch. Alembic scans all of them; the branch labels in each
# baseline revision keep the graphs separate.
version_locations = src/atlas_api/modules/auth/migrations/versions src/atlas_api/modules/credentials/migrations/versions

# UUIDv7-ordered filenames would be nicer, but revision ids must be stable and short;
# a date prefix keeps `ls` chronological, which is how humans read a versions directory.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

prepend_sys_path = src
path_separator = space
truncate_slug_length = 40

# Fail rather than silently create a second head when a revision omits down_revision.
revision_environment = false

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
