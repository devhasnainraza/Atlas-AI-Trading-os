# Core infrastructure dependencies for local development (Spec 00 US5).
# Apps run via compose.dev.yaml or directly on the host with hot reload.
name: atlas

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_local_dev
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --mode dev-container
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atlas
      MINIO_ROOT_PASSWORD: atlas_local_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local SMTP sink (Spec 01). Every verification, reset, magic-link, and security
  # alert email lands here and NOTHING leaves the machine — which is the point: a
  # misconfigured provider key in development must not be able to mail a real
  # person. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    environment:
      MP_MAX_MESSAGES: 500
      # Accept anything: local senders are not authenticated, and rejecting them
      # would turn "email misconfigured" into "auth flow broken".
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit-data:/data
    healthcheck:
  # IB Gateway sidecar (Spec 03 US1, T039). Profile-gated and capability-limited.
  ib-gateway:
    profiles: ["ibkr"]
    image: ghcr.io/gnzsnz/ib-gateway:latest
    ports:
      - "4002:4002"
      - "5000:5000"
    environment:
      TWS_USERID: "${IBKR_USERID:-edemo}"
      TWS_PASSWORD: "${IBKR_PASSWORD:-demouser}"
      TRADING_MODE: "${IBKR_MODE:-paper}"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4002 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:

  postgres-data:
  redis-data:
  redpanda-data:
  minio-data:
  mailpit-data:
  # MaxMind GeoLite2 City database, refreshed weekly by a scheduled job. Login
  # geo signals (new country, impossible travel) read it; when the file is absent
  # those signals are SKIPPED rather than guessed, so an empty volume degrades
  # detection without breaking sign-in.
  geoip-data:
