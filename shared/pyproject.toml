[project]
name = "atlas-shared"
version = "0.1.0"
description = "Shared Atlas platform packages: atlas_core, atlas_events, atlas_observability, atlas_ai"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_core", "atlas_events", "atlas_observability", "atlas_ai"]
